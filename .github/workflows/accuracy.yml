# 機能ごとの精度の台（tools/gen/accuracy_bench.py の BENCHES）を流す。リポジトリは公開しているので重い物は Actions の枠を使う。
name: accuracy
on:
  workflow_dispatch:
  push:
    branches: ["claude/FIX-accuracy-*"]
    paths:
      - "tools/gen/qcbench.py"
      - "tools/gen/accuracy_bench.py"
      - ".github/workflows/accuracy.yml"
permissions:
  contents: read
concurrency:
  group: accuracy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CD_FETCH: "1"   # 部位分けと拡大の重みをこの機械で取る
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q --index-url https://download.pytorch.org/whl/cpu torch && pip install -q numpy scipy scikit-image pillow transformers huggingface_hub PySide6
      - name: 重い物を流す
        run: python tools/gen/accuracy_bench.py --only 検品単体 --json accuracy.json | tee accuracy.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy
          path: |
            accuracy.txt
            accuracy.json
          retention-days: 7
