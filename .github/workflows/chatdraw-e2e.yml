# 組んだ Setup.exe を Windows の機械に入れ、起動・初回の取得・描く・アンインストールを本物の経路で通す（chatdraw/e2e.py）。
# 手元の Linux や wine では、pythonw の出力の無さや ProgramData の権限など、Windows だけで起きる崩れを見つけられなかった。
# リポジトリは公開しているので Actions の枠を使わない。1 回 約 20 分（Setup.exe を組む 約 5 分、取得と描く 約 10 分）。
name: chatdraw-e2e
on:
  push:
    paths:
      - "chatdraw/**"
      - "packaging/chatdraw/**"
      - "VERSION"
      - ".github/workflows/chatdraw-e2e.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: chatdraw-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - run: sh packaging/chatdraw/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: dist/CharacterDesigner-Setup.exe
          retention-days: 3
  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: setup
      - name: 入れる
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\CharacterDesigner-Setup.exe -ArgumentList '/S' -Wait -PassThru
          "exit=$($p.ExitCode)"
          Get-ChildItem "C:\Program Files\CharacterDesigner" | Select-Object Name
          if (-not (Test-Path "C:\Program Files\CharacterDesigner\python\pythonw.exe")) { throw "入っていない" }
      - name: 起動・取得・描く
        shell: pwsh
        run: |
          & "C:\Program Files\CharacterDesigner\python\python.exe" -E -s -m chatdraw.e2e "$env:RUNNER_TEMP\e2e"
          $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP\e2e\report.json"
          if ($code -ne 0) { exit $code }
        working-directory: C:\Program Files\CharacterDesigner
      - name: アンインストールして残りを見る
        if: always()
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "C:\Program Files\CharacterDesigner\Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          # アンインストーラーは自分を一時の場所に写して動くので、終わるまで待つ
          for ($i = 0; $i -lt 60 -and (Test-Path "C:\Program Files\CharacterDesigner"); $i++) { Start-Sleep 2 }
          $left = @("C:\Program Files\CharacterDesigner", "C:\ProgramData\CharacterDesigner",
                    "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\CharacterDesigner",
                    "C:\Users\Public\Desktop\CharacterDesigner.lnk") | Where-Object { Test-Path $_ }
          "残った物: $($left -join ', ')"
          if ($left) { Get-ChildItem -Recurse $left | Select-Object -First 30 FullName; throw "アンインストールで残った物がある" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: ${{ runner.temp }}/e2e
          retention-days: 7
