# 手と足の指の数を小さな VLM に数えさせる方法を、正解つきの切り出し（tests/fixtures/fingercount）で測る。
# 模型は数 GB あり手元の機械に置けないので、公開リポジトリの Actions の枠で動かす。結果は draw-results ブランチの <実行の番号>/ に置く
name: fingercount-eval
on:
  push:
    paths:
      - ".github/workflows/fingercount-eval.yml"
      - "tools/gen/vlmcount.py"
      - "tests/fixtures/fingercount/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: ["HuggingFaceTB/SmolVLM2-2.2B-Instruct"]   # Qwen2.5-VL-3B は実行 40205512880 で測った
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -q "transformers==4.53.2" accelerate pillow num2words
      - name: eval
        env:
          CD_VLM_MODEL: ${{ matrix.model }}
        run: |
          nproc; free -g
          mkdir -p out
          n=$(basename "$CD_VLM_MODEL")
          # 記録はこのブランチから読めないので、失敗の原因も結果と一緒に draw-results に置く
          set -o pipefail
          python3 tools/gen/vlmcount.py eval tests/fixtures/fingercount "out/$n.json" 2>&1 | tail -c 20000 | tee "out/$n.log"
      - if: always()
        run: sh .github/scripts/draw-results.sh out
