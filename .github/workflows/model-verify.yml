# 絵の模型を実際に動かして確かめ、点を 1 つ付けて目録（chatdraw/catalog.json）に書き戻す（chatdraw/verify_models.py）。
# どの模型も、頼んだ通りに描けたかを測る台（adherebench）の同じ 5 本を同じ種で描き、描けた語の割合と崩れの無い絵の割合から点を付ける。
# 模型は 1 つ 7GB ほどあり、1 枚 10 分ほどかかるので、手元ではなく Actions で流す（リポジトリは公開しているので Actions の枠を使う）。
# 描いた絵と点は artifact に 30 日置く。点は claude/MODELSCORE-<日付> のブランチに積み、PR とマージは人が確かめてから行う。
name: model-verify
on:
  schedule:
    - cron: "23 17 * * 4"   # 毎週金曜 2:23（日本時間）
  push:
    branches: [main]
    paths:
      - "config/verify-models.txt"
      - "chatdraw/verify_models.py"
      - ".github/workflows/model-verify.yml"
  workflow_dispatch:
    inputs:
      repos:
        description: "確かめる模型（空なら点が 0 の物と config/verify-models.txt。いくつも書くときは空白で区切る）"
        default: ""
permissions:
  contents: read
concurrency:
  group: model-verify
  cancel-in-progress: false   # 前は新しい push で走っている検証が取り消され、1 つも点が付かなかった
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repos: ${{ steps.r.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: r
        env:
          WANT: ${{ inputs.repos }}
        run: |
          if [ -n "$WANT" ]; then
            echo "repos=$(python3 -c 'import json,os;print(json.dumps(os.environ["WANT"].split()))')" >> "$GITHUB_OUTPUT"
          else
            echo "repos=$(python3 -m chatdraw.verify_models list)" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
  verify:
    needs: list
    if: needs.list.outputs.repos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180   # SDXL を 5 枚で 約 60 分。前の 330 分では止まった模型が枠を食い続けた
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        repo: ${{ fromJson(needs.list.outputs.repos) }}
    steps:
      - uses: actions/checkout@v4
      - name: 置き場を空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1; free -g
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 部品
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate safetensors huggingface_hub pillow numpy scipy
      - name: 描く
        timeout-minutes: 150
        env:
          LLM_HOME: ${{ runner.temp }}/llm
          CD_HOME: ${{ runner.temp }}/cd
          CD_ASSUME_FREE_RAM_GB: "14"
        run: |
          name=$(echo "${{ matrix.repo }}" | tr '/' '_')
          echo "NAME=$name" >> "$GITHUB_ENV"
          python -u -m chatdraw.verify_models draw "${{ matrix.repo }}" "out/$name"
      - name: 名前
        if: always()
        run: echo "NAME=$(echo "${{ matrix.repo }}" | tr '/' '_')" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-${{ env.NAME }}
          path: out/
          retention-days: 30
  score:
    needs: verify
    if: always() && needs.verify.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # 点を claude/MODELSCORE-<日付> のブランチに積むため（main には書かない）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 部品
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q huggingface_hub pillow numpy scipy onnxruntime ai-edge-litert opencv-python-headless
      - uses: actions/download-artifact@v4
        with:
          pattern: verify-*
          path: art
      - name: 検品して点を付ける
        env:
          LLM_HOME: ${{ runner.temp }}/llm
          CD_HOME: ${{ runner.temp }}/cd
        run: |
          mkdir -p scores
          for d in art/verify-*/*/; do
            name=$(basename "$d")
            repo=$(cat "$d/repo.txt" 2>/dev/null || echo "$name")
            python -u -m chatdraw.verify_models score "$repo" "$d" || true
            [ -f "$d/score.json" ] && cp "$d/score.json" "scores/$name.json"
          done
          ls scores
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-scores
          path: scores/
          retention-days: 30
      - name: 目録に書き戻す（ブランチに積む）
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: |
          ls scores/*.json >/dev/null 2>&1 || exit 0
          python -m chatdraw.verify_models write scores/*.json | tee -a "$GITHUB_STEP_SUMMARY"
          git diff --quiet chatdraw/catalog.json && exit 0
          branch="claude/MODELSCORE-$(TZ=Asia/Tokyo date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -qm "模型の点を自動の検証で付け直す（実行 $GITHUB_RUN_ID）" chatdraw/catalog.json
          git push -f origin "$branch"
          echo "点を $branch に積んだ" >> "$GITHUB_STEP_SUMMARY"
