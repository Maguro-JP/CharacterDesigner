# 絵の模型を実際に動かして確かめる（chatdraw/verify_models.py）。1 つの模型で、取る 約 5 分、描く 3 枚で 約 40 分（CPU）。
# 模型は 7GB ほどあり、手元では置き場が足りないので、ここで流す。リポジトリは公開しているので Actions の枠を使わない。
# 出来た絵と数字は artifact に 7 日だけ置く。絵の出来を見て、catalog.json の点を付ける。
name: model-verify
on:
  push:
    paths:
      - "config/verify-models.txt"
      - "chatdraw/verify_models.py"
      - ".github/workflows/model-verify.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: model-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repos: ${{ steps.r.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: echo "repos=$(grep -v '^#' config/verify-models.txt | grep -v '^\s*$' | python3 -c 'import json,sys;print(json.dumps([l.strip() for l in sys.stdin]))')" >> "$GITHUB_OUTPUT"
  verify:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 遅い機械では 1 枚 15 分を超え、150 分で 8 つ中 7 つが打ち切られた（2026-10-25）
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repo: ${{ fromJson(needs.list.outputs.repos) }}
    steps:
      - uses: actions/checkout@v4
      - name: 置き場を空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/model-verify.yml
      - name: 部品
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate safetensors huggingface_hub pillow numpy scipy
      - name: 動かす
        env:
          LLM_HOME: ${{ runner.temp }}/llm
          CD_HOME: ${{ runner.temp }}/cd
        run: |
          name=$(echo "${{ matrix.repo }}" | tr '/' '_')
          echo "NAME=$name" >> "$GITHUB_ENV"
          python -u -m chatdraw.verify_models "${{ matrix.repo }}" "out/$name"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-${{ env.NAME }}
          path: out/
          retention-days: 7
