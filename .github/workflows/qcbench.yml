# 検品単体の精度の台（tools/gen/qcbench.py）を、前の版（main）と今の版で測る。
# library/feedback の人の判定 113 枚に、手・足・顔・体・タグの模型を全部通すので、手元の CPU で約 80 分かかる。
# リポジトリは公開しているので Actions の枠を使い、絵を 4 つに分けて並べて流し、最後に結果を集めて種類ごとの数字を出す。
name: qcbench
on:
  push:
    branches: ["claude/FIX-qc-*"]
    paths:
      - ".github/workflows/qcbench.yml"
      - "chatdraw/handcheck.py"
      - "chatdraw/qcmanual.py"
      - "chatdraw/sanity.py"
      - "tools/gen/facecheck.py"
      - "tools/gen/feet.py"
      - "tools/gen/tagger.py"
      - "tools/gen/qcbench.py"
  workflow_dispatch:
    inputs:
      before:
        description: "前の版（ブランチかコミット）"
        default: "main"
permissions:
  contents: read
concurrency:
  group: qcbench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        side: [before, after]
        shard: [0, 1, 2, 3]
    env:
      CD_FETCH: "1"
    steps:
      - run: echo "CD_HOME=$RUNNER_TEMP/cd" >> "$GITHUB_ENV"   # runner の置き場は job の env では使えない
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 測る版を置く
        run: |
          ref="${{ matrix.side == 'before' && (inputs.before || 'main') || github.sha }}"
          git rev-parse "origin/$ref" >/dev/null 2>&1 && ref="origin/$ref"
          git worktree add "$RUNNER_TEMP/tree" "$ref"
          cp tools/gen/qcbench.py "$RUNNER_TEMP/tree/tools/gen/qcbench.py"   # 測る台は今の版の物を使う
          rm -rf "$RUNNER_TEMP/tree/library" && cp -r library "$RUNNER_TEMP/tree/library"   # 測る絵は同じ物
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 部品
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers huggingface_hub pillow numpy scipy onnxruntime ai-edge-litert timm
      - name: 模型を取る
        working-directory: ${{ runner.temp }}/tree
        run: |
          python3 tools/gen/tagger.py setup
          python3 -c "import sys; sys.path.insert(0, '.'); from chatdraw import handcheck, requestcheck; handcheck.ensure_models(True); handcheck.ensure_feet_model(True); requestcheck._tagger(True)"
          python3 -c "import sys; sys.path.insert(0, '.'); from huggingface_hub import snapshot_download; from chatdraw.paths import HUB; from chatdraw.twostage import POSE; snapshot_download(POSE, cache_dir=str(HUB), allow_patterns=['*.json', '*.safetensors'])"
          python3 -c "import sys; sys.path[:0] = ['.', 'tools/gen']; import edit; from huggingface_hub import snapshot_download; from chatdraw.sanity import PERSON_MODEL; snapshot_download(PERSON_MODEL)"
      - name: 測る
        working-directory: ${{ runner.temp }}/tree
        run: python3 tools/gen/qcbench.py --shard ${{ matrix.shard }}/4 2>&1 | grep -v "^取りこぼし" | tail -20
      - uses: actions/upload-artifact@v4
        with:
          name: qc-${{ matrix.side }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/cd/qcbench
          retention-days: 7
  score:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        side: [before, after]
    steps:
      - run: echo "CD_HOME=$RUNNER_TEMP/cd" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow numpy huggingface_hub onnxruntime
      - uses: actions/download-artifact@v4
        with:
          pattern: qc-${{ matrix.side }}-*
          path: ${{ runner.temp }}/cd/qcbench
          merge-multiple: true
      - name: 種類ごとの数字（貯めた結果で採点する。足りない絵だけ測る）
        run: python3 tools/gen/qcbench.py --score-only --json "qcbench-${{ matrix.side }}.json" 2>&1 | grep -v "^取りこぼし" | tail -20
      - uses: actions/upload-artifact@v4
        with:
          name: qcbench-${{ matrix.side }}
          path: qcbench-${{ matrix.side }}.json
          retention-days: 7
