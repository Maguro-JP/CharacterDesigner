# 0.5.21（main）と 0.5.22 の候補を、同じ機械・同じ頼み・同じ種で続けて流し、工程ごとの秒・型・スワップを測る（測るだけのブランチ）
name: qcspeed
on:
  push:
    paths:
      - ".github/workflows/qcspeed.yml"
      - "chatdraw/qcspeed.py"
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 置き場を空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1; free -g; nproc; lscpu | grep -E "Model name|Flags" | grep -oE "Model name.*|avx512_bf16|amx_bf16|avx512f |avx2" | sort -u
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 部品
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate safetensors huggingface_hub pillow numpy scipy scikit-image ai-edge-litert onnxruntime PySide6
      - name: 測る
        timeout-minutes: 320
        env:
          LLM_HOME: ${{ runner.temp }}/llm
          CD_HOME: ${{ runner.temp }}/cd
          CD_FETCH: "1"
          QT_QPA_PLATFORM: offscreen
          QC_SIZE: "640x896"
          QC_STEPS: "8"
          QC_BUDGET_MIN: "140"
        run: |
          cp chatdraw/qcspeed.py "$RUNNER_TEMP/qcspeed.py"
          mkdir -p qc-out
          (vmstat -t 30 > qc-out/vmstat.txt) &
          for ref in d41afc0d 3eaae4be; do
            d="$RUNNER_TEMP/src-$ref"; git worktree add -f --detach "$d" "$ref"
            cp "$RUNNER_TEMP/qcspeed.py" "$d/chatdraw/qcspeed.py"
            echo "== $ref $(date -u +%T)" >> qc-out/vmstat.txt
            (cd "$d" && timeout $(( QC_BUDGET_MIN * 60 + 600 )) python -u -m chatdraw.qcspeed "$GITHUB_WORKSPACE/qc-out/$ref" "$ref") || echo "$ref が途中で終わった"
            free -m
          done
          awk 'NR>2 && $7+$8>0' qc-out/vmstat.txt | tail -20; echo "si/so の 0 でない行: $(awk 'NR>2 && ($7+$8)>0' qc-out/vmstat.txt | wc -l) / $(wc -l < qc-out/vmstat.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qcspeed-measure522
          path: qc-out
