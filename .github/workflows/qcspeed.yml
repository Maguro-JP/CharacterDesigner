# 1 枚を描いて直すまでの工程ごとの秒を、前の版と今の版で同じ機械・同じ頼み・同じ種で測る（chatdraw/qcspeed.py）。
# 測る物差しは今のブランチの chatdraw/qcspeed.py を使い、測られる側の chatdraw は版ごとに checkout した物にする。
name: qcspeed
on:
  push:
    paths:
      - ".github/workflows/qcspeed.yml"
      - "chatdraw/qcspeed.py"
      - "chatdraw/persist.py"
  workflow_dispatch:
    inputs:
      steps:
        default: "12"
      budget_min:
        description: "1 版あたりの上限（分）。越えたら止めるボタンと同じに止め、測れた分を書く"
        default: "150"
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        ref: [v0.5.19, b6e75f34, HEAD]   # 0.5.19、直す前（0.5.20 の後）、今
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 置き場を空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1; free -g; nproc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 部品
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate safetensors huggingface_hub pillow numpy scipy scikit-image ai-edge-litert onnxruntime PySide6
      - name: 測る
        env:
          LLM_HOME: ${{ runner.temp }}/llm
          CD_HOME: ${{ runner.temp }}/cd
          CD_FETCH: "1"
          QT_QPA_PLATFORM: offscreen
          QC_STEPS: ${{ inputs.steps || '12' }}
          QC_BUDGET_MIN: ${{ inputs.budget_min || '150' }}
        run: |
          cp chatdraw/qcspeed.py "$RUNNER_TEMP/qcspeed.py"
          ref="${{ matrix.ref }}"
          d="$RUNNER_TEMP/src"; git worktree add -f --detach "$d" "$ref"
          cp "$RUNNER_TEMP/qcspeed.py" "$d/chatdraw/qcspeed.py"
          (cd "$d" && timeout $(( QC_BUDGET_MIN * 60 + 900 )) python -u -m chatdraw.qcspeed "$GITHUB_WORKSPACE/qc-out/$ref" "$ref") || echo "$ref が途中で終わった"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qcspeed-${{ matrix.ref }}
          path: qc-out
