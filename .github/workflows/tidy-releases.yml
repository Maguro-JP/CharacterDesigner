# 作業ブランチから置いた試す版（chatdraw-test-* の prerelease）と、その札（tag）を消す。
# 今はブランチの版を Release に置かず artifact に置くので、残っているのは前の作りで置いた物だけ。
# 公開している版（v*）は消さない。手で流す（workflow_dispatch）。
name: tidy-releases
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 試す版を消す
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.prerelease and (.tag_name | startswith("chatdraw-test-"))) | "\(.id) \(.tag_name)"' |
          while read -r id tag; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" && echo "消した: $tag"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
          done
