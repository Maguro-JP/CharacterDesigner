<title>アニメ素体 ポーズと光</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@1.0.6/lib/three-vrm.min.js"></script>
<style>
/* 撮影台: 上に回せる模型、下にポーズ・光・向きの操作盤 */
:root {
  --bg: #f6f5f3; --stage: #ffffff; --fg: #171615; --muted: #6d6863; --line: #dedad5;
  --accent: #d6331f; --accent-2: #e8811c;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141312; --stage: #1d1c1a; --fg: #f1eeea; --muted: #a29c95; --line: #34312e;
  --accent: #ff5a43; --accent-2: #ffa04a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141312; --stage: #1d1c1a; --fg: #f1eeea; --muted: #a29c95; --line: #34312e;
  --accent: #ff5a43; --accent-2: #ffa04a; color-scheme: dark }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); }
.wrap { box-sizing: border-box; min-height: 100%; max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px }
h1 { font-size: 1.2rem; margin: 0; letter-spacing: .02em }
h1 span { color: var(--accent) }
.spec { font-family: var(--f-mono); font-size: .72rem; color: var(--muted) }
.stage { position: relative; height: 62vh; min-height: 340px; background: var(--stage); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; touch-action: none }
.stage canvas { display: block; width: 100%; height: 100% }
.load { position: absolute; inset: auto 0 12px 0; text-align: center; font-size: .8rem; color: var(--muted); font-family: var(--f-mono) }
.label { font-size: .72rem; letter-spacing: .08em; color: var(--muted); margin: 4px 0 -4px }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px }
.row button { font: inherit; font-size: .88rem; padding: 9px 0; border-radius: 4px; border: 1px solid var(--line); background: var(--stage); color: var(--fg); cursor: pointer }
.row button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700 }
.row button:focus-visible, input:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px }
.sliders { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 16px }
.sliders label { display: grid; grid-template-columns: 5em 1fr 3em; align-items: center; gap: 8px; font-size: .82rem }
.sliders output { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums }
input[type=range] { width: 100%; accent-color: var(--accent) }
.hint { margin: 0; font-size: .76rem; color: var(--muted); line-height: 1.6 }
</style>

<div class="wrap">
  <header>
    <h1>アニメ素体 <span>ポーズと光</span></h1>
    <div class="spec">VRoid のサンプル素体 ・ 陰2段</div>
  </header>
  <div class="stage" id="stage"><div class="load" id="load">読み込み中</div></div>

  <p class="label">服</p>
  <div class="row" role="group" aria-label="服" id="wear">
    <button id="w-swim" data-w="swim" aria-pressed="true">水着</button>
    <button id="w-casual" data-w="casual" aria-pressed="false">普段着</button>
  </div>
  <p class="label">亜人の部品（付け根: 尾は尾骶骨、翼は肩甲骨、角は額の上、獣耳は頭頂。獣耳のときは人の耳を引っ込める）</p>
  <div class="row" role="group" aria-label="亜人の部品" id="parts">
    <button id="k-none" data-k="none" aria-pressed="true">人</button>
    <button id="k-cat" data-k="cat" aria-pressed="false">猫（耳・尾）</button>
    <button id="k-devil" data-k="devil" aria-pressed="false">悪魔（角・翼・尾）</button>
    <button id="k-fox" data-k="fox" aria-pressed="false">狐（耳・尾）</button>
    <button id="k-rabbit" data-k="rabbit" aria-pressed="false">兎（耳・尾）</button>
    <button id="k-angel" data-k="angel" aria-pressed="false">天使（羽）</button>
  </div>
  <p class="label">体型（理想のベースに寄せた値が既定）</p>
  <div class="sliders" id="body">
    <label for="b-bust">胸<input id="b-bust" type="range" min="0" max="100" value="55"><output id="b-bust-o"></output></label>
    <label for="b-waist">ウエスト<input id="b-waist" type="range" min="-30" max="20" value="-12"><output id="b-waist-o"></output></label>
    <label for="b-hip">腰まわり<input id="b-hip" type="range" min="-10" max="30" value="12"><output id="b-hip-o"></output></label>
    <label for="b-thigh">太もも<input id="b-thigh" type="range" min="-20" max="30" value="4"><output id="b-thigh-o"></output></label>
    <label for="b-leg">脚の長さ<input id="b-leg" type="range" min="-10" max="20" value="6"><output id="b-leg-o"></output></label>
    <label for="b-head">頭<input id="b-head" type="range" min="-15" max="15" value="0"><output id="b-head-o"></output></label>
  </div>
  <div class="row" role="group" aria-label="体型の操作">
    <button id="b-reset">サンプルの体</button>
    <button id="b-ideal">理想のベース</button>
    <button id="b-copy">数字を写す</button>
  </div>
  <p class="hint" id="b-json" hidden></p>

  <p class="label">ポーズ</p>
  <div class="row" role="group" aria-label="ポーズ" id="poses"></div>

  <p class="label">光の向きと強さ</p>
  <div class="sliders">
    <label for="az">横の向き<input id="az" type="range" min="-180" max="180" value="-35"><output id="az-o">-35°</output></label>
    <label for="el">高さ<input id="el" type="range" min="-30" max="90" value="40"><output id="el-o">40°</output></label>
    <label for="key">主の光<input id="key" type="range" min="0" max="300" value="70"><output id="key-o">70%</output></label>
    <label for="amb">回り込み<input id="amb" type="range" min="0" max="200" value="35"><output id="amb-o">35%</output></label>
  </div>
  <div class="row" role="group" aria-label="光の色" id="tones">
    <button id="t-day" data-c="#ffffff" aria-pressed="true">昼</button>
    <button id="t-sunset" data-c="#ffb070">夕方</button>
    <button id="t-night" data-c="#8aa8ff">夜</button>
    <button id="t-back" data-back="1">逆光</button>
  </div>

  <p class="label">向き</p>
  <div class="row" role="group" aria-label="向き">
    <button id="v-front" data-a="0" aria-pressed="true">正面</button>
    <button id="v-34" data-a="35">斜め</button>
    <button id="v-side" data-a="90">横</button>
    <button id="v-back" data-a="180">背面</button>
    <button id="v-face" data-a="0" data-face="1">顔</button>
  </div>
  <p class="hint">1本指で回す、2本指で寄る・ずらす。素体は VRoid の公式サンプル HairSample_Female（CC0）。水着は肌に塗っていて、体型を変えても突き抜けない。普段着はその上に重なる。</p>
</div>

<script>
const stage = document.getElementById('stage');
const load = document.getElementById('load');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, 0.05, 30);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
const amb = new THREE.AmbientLight(0xffffff, 0.35);
const key = new THREE.DirectionalLight(0xffffff, 0.7);
scene.add(amb, key, key.target);
let vrm = null, height = 1.6, center = new THREE.Vector3(0, 0.85, 0);
// 陰2段の塗りの段（暗い所と明るい所）。古い形式の素材を置き換えるときに使う
// 陰の段: 暗い側（少し赤みのある陰）と明るい側の2段。境目だけ少しぼかす。
// 境目を切り立てると、網目の粗い所（背中、お尻の横）で陰の縁が角張って見えた
const ramp = (() => {
  const N = 32, d = new Uint8Array(N * 4), lo = [170, 150, 150];
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1), k = Math.min(1, Math.max(0, (t - 0.44) / 0.14)), e = k * k * (3 - 2 * k);
    for (let c = 0; c < 3; c++) d[i * 4 + c] = Math.round(lo[c] + (255 - lo[c]) * e);
    d[i * 4 + 3] = 255;
  }
  const r = new THREE.DataTexture(d, N, 1);
  r.minFilter = r.magFilter = THREE.LinearFilter; r.needsUpdate = true;
  return r;
})();

function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

// 光: 横の向き（体の周り）と高さの角度から、光の位置を決める
let backlight = false;
function light() {
  const az = +document.getElementById('az').value * Math.PI / 180;
  const el = +document.getElementById('el').value * Math.PI / 180;
  const a = backlight ? az + Math.PI : az;
  key.position.set(Math.sin(a) * Math.cos(el) * 3, center.y + Math.sin(el) * 3, Math.cos(a) * Math.cos(el) * 3);
  key.target.position.copy(center);
  key.intensity = +document.getElementById('key').value / 100;
  amb.intensity = +document.getElementById('amb').value / 100 * (backlight ? 0.5 : 1);
  for (const id of ['az', 'el', 'key', 'amb']) {
    const v = document.getElementById(id).value;
    document.getElementById(id + '-o').textContent = v + (id === 'az' || id === 'el' ? '°' : '%');
  }
}
['az', 'el', 'key', 'amb'].forEach(id => document.getElementById(id).addEventListener('input', light));

function press(group, b) { group.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); }
document.querySelectorAll('#tones button').forEach(b => b.addEventListener('click', () => {
  press(b.parentNode, b);
  backlight = !!b.dataset.back;
  key.color.set(b.dataset.c || '#ffe8d0');
  light();
}));

function view(deg, face) {
  const t = face ? new THREE.Vector3(0, height * 0.92, 0) : center.clone();
  const d = face ? 0.9 : height * 2.4, a = deg * Math.PI / 180;
  controls.target.copy(t);
  camera.position.set(Math.sin(a) * d, t.y + (face ? 0 : 0.05), Math.cos(a) * d);
  controls.update();
}
document.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => { press(b.parentNode, b); view(+b.dataset.a, !!b.dataset.face); }));

// ポーズ: 人型の骨（VRM の humanoid）ごとの回転（度、XYZ）。指定の無い骨は直立のまま。
// VRM 1.0 の模型は +Z を向き、左腕は +X 側にある。腕を下ろすには左腕の Z を負、右腕の Z を正に回す
const D = Math.PI / 180;
const POSES = {
  't': { ja: '直立', bones: {} },
  'stand': { ja: '気をつけ', bones: { leftUpperArm: [0, 0, -70], rightUpperArm: [0, 0, 70] } },
  'contra': { ja: '片足重心', bones: {
    hips: [0, 0, 5], spine: [0, 0, -4], chest: [0, 0, -3],
    leftUpperArm: [0, 0, -75], rightUpperArm: [0, -10, 48], rightLowerArm: [0, 0, 92],   // 右手を腰に（肘を外へ張り、前腕を腰へ向ける）
    leftUpperLeg: [0, 0, 4], rightUpperLeg: [-6, 0, -8], rightLowerLeg: [14, 0, 0], neck: [0, 0, 4] } },
  'arms': { ja: '腕組み', bones: {
    leftUpperArm: [0, -30, -80], leftLowerArm: [-58.3, -63.6, -84], rightUpperArm: [0, 30, 80], rightLowerArm: [-58.3, 63.6, 84], head: [0, 0, 6] } },
  // 腕組みの前腕は、胸の下を水平に内へ向く向き（少し下向き）から逆算した値。X だけのひねりでは、オイラー角の順番のため
  // 腕が背中へ回るか顔の前へ上がるかになった。胸の高さで組むと胸を隠すしぐさに見えるので、胸から離して組む
  'walk': { ja: '歩き', bones: {
    leftUpperLeg: [-22, 0, 0], leftLowerLeg: [8, 0, 0], rightUpperLeg: [18, 0, 0], rightLowerLeg: [28, 0, 0],
    leftUpperArm: [20, 0, -72], rightUpperArm: [-22, 0, 72], spine: [4, 0, 0] } },
  'wave': { ja: '手を振る', bones: {
    leftUpperArm: [0, 0, -72], rightUpperArm: [0, 0, -60], rightLowerArm: [0, 30, -70], head: [0, 0, -5] } }
};
function pose(id) {
  const p = POSES[id];
  const h = vrm.humanoid;
  for (const name of Object.keys(THREE_VRM.VRMHumanBoneName).map(k => THREE_VRM.VRMHumanBoneName[k])) {
    const node = h.getNormalizedBoneNode(name);
    if (!node) continue;
    const r = p.bones[name] || [0, 0, 0];
    // VRM 0.x は模型を縦の軸（Y）まわりに 180 度回して表示する。そのため X と Z の回転の向きが逆になり、Y はそのまま
    const f = vrm.meta.metaVersion === '0' ? -1 : 1;
    node.rotation.set(r[0] * D * f, r[1] * D, r[2] * D * f);
  }
  vrm.scene.position.y = -(p.drop || 0);
}
const poseRow = document.getElementById('poses');
Object.entries(POSES).forEach(([id, p], i) => {
  const b = document.createElement('button');
  b.id = 'p-' + id; b.textContent = p.ja; b.setAttribute('aria-pressed', i === 1 ? 'true' : 'false');
  b.addEventListener('click', () => { press(poseRow, b); if (vrm) pose(id); });
  poseRow.appendChild(b);
});

// three 0.147 の属性には getComponent が無いので、4つの成分を名前で読む
const comp = (a, v, k) => k === 0 ? a.getX(v) : k === 1 ? a.getY(v) : k === 2 ? a.getZ(v) : a.getW(v);
// 体型: 骨の伸び縮み（脚の長さ・太さ、頭）と、肌と服の点を動かす（胸・ウエスト・腰）の2通りで変える。
// 点は骨の重み（skin weight）で部位を見分ける。点だけ動かすと関節の回転とずれるので、関節をまたぐ所（脚）は骨で変える
const IDEAL = { bust: 55, waist: -12, hip: 12, thigh: 4, leg: 6, head: 0 };
const ZERO = { bust: 0, waist: 0, hip: 0, thigh: 0, leg: 0, head: 0 };
let meshes = [], bind = null;
// 骨の番号は模型ごと（顔と体で別の骨組み）に違う。名前から、その模型の中の番号を引く
function setupBody() {
  vrm.scene.traverse(o => { if (o.isSkinnedMesh) meshes.push(o); });
  // 骨の位置は肌の模型の座標で求める。模型ごとに座標の向きが違い、髪の模型で求めると前後が逆になった
  const any = meshes.find(m => matName(m).includes('Body_00_SKIN'));
  const at = n => any.skeleton.bones.find(b => b.name === n);
  // 骨の位置は全体の座標で持たれている。肌の点（模型の中の座標）と比べるため、模型の中の座標に直す。
  // bindMatrixInverse は毎フレーム今の向きから作り直され、VRM 0.x を前に向ける 180° 回転が混ざるので使わない
  const pos = n => { const sk = any.skeleton; const i = sk.bones.indexOf(at(n)); return new THREE.Vector3().setFromMatrixPosition(sk.boneInverses[i].clone().invert()).applyMatrix4(any.bindMatrix.clone().invert()); };
  meshes.forEach(m => {
    m.userData.orig = m.geometry.attributes.position.array.slice();
    const ix = n => m.skeleton.bones.findIndex(b => b.name === n);
    m.userData.B = { spine: ix('J_Bip_C_Spine'), hips: ix('J_Bip_C_Hips'), legs: [ix('J_Bip_L_UpperLeg'), ix('J_Bip_R_UpperLeg')] };
  });
  // 胸は専用の骨（揺れ用の J_Sec_*_Bust1）を大きくする。点を動かすより、付け根からの形が崩れない
  bind = { spine: pos('J_Bip_C_Spine'), hips: pos('J_Bip_C_Hips'), upperChest: pos('J_Bip_C_UpperChest'),
           neck: pos('J_Bip_C_Neck'), bustPos: [pos('J_Sec_L_Bust1'), pos('J_Sec_L_Bust2')],
           bust: ['J_Sec_L_Bust1', 'J_Sec_R_Bust1'].map(at).filter(Boolean) };
  // 前の向き（+1 なら +z が前）。胸の骨の付け根から先へ向かう向きで決める。この素体は −z が前
  bind.F = Math.sign(bind.bustPos[1].z - bind.bustPos[0].z) || 1;
}
function weight(si, sw, v, bones) {
  let w = 0;
  for (let k = 0; k < 4; k++) if (bones.includes(comp(si, v, k))) w += comp(sw, v, k);
  return w;
}
// 法線（光の当たる向き）を作り直す。VRoid の書き出しでは1つの模型の部分（Bodybaked と Bodybaked_1 など）が
// 位置と法線の配列を共有している。部分ごとに computeVertexNormals を呼ぶと、呼ぶたびに共有の配列が 0 に戻され、
// 最後の部分以外が真っ黒になった。共有する組ごとに全部の三角形を集めて1回で計算する。
// UV の継ぎ目で分かれた点は同じ位置なら1つにまとめ、継ぎ目に光の割れ目が出ないようにする
function relight() {
  const groups = new Map();
  meshes.forEach(m => { if (!m.userData.moved || !m.geometry.index) return; const n = m.geometry.attributes.normal; if (!groups.has(n)) groups.set(n, []); groups.get(n).push(m); });
  for (const [n, ms] of groups) {
    const g0 = ms[0].geometry, p = g0.attributes.position;
    if (!g0.userData.weld) {
      const key = new Map(), id = new Int32Array(p.count), o = ms[0].userData.orig;
      for (let v = 0; v < p.count; v++) {
        const k = Math.round(o[v * 3] * 1e4) + ',' + Math.round(o[v * 3 + 1] * 1e4) + ',' + Math.round(o[v * 3 + 2] * 1e4);
        if (!key.has(k)) key.set(k, key.size); id[v] = key.get(k);
      }
      g0.userData.weld = { id, size: key.size };
    }
    const { id, size } = g0.userData.weld, acc = new Float32Array(size * 3);
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    for (const m of ms) {
      const idx = m.geometry.index.array;
      for (let t = 0; t < idx.length; t += 3) {
        a.fromBufferAttribute(p, idx[t]); b.fromBufferAttribute(p, idx[t + 1]); c.fromBufferAttribute(p, idx[t + 2]);
        c.sub(b); b.sub(a); c.cross(b);   // 面の向き（面積で重み付け）
        for (let k = 0; k < 3; k++) { const w = id[idx[t + k]] * 3; acc[w] += c.x; acc[w + 1] += c.y; acc[w + 2] += c.z; }
      }
    }
    for (let v = 0; v < p.count; v++) {
      const w = id[v] * 3, x = acc[w], y = acc[w + 1], z = acc[w + 2], l = Math.hypot(x, y, z);
      if (l > 0) n.setXYZ(v, x / l, y / l, z / l);   // 三角形に使われていない点は元の向きのまま
    }
    n.needsUpdate = true;
  }
}
function shape(b) {
  if (!bind) return;
  const { spine, hips } = bind;
  const waist = b.waist / 100, hip = b.hip / 100;
  meshes.forEach(m => {
    const B = m.userData.B;
    if (B.spine < 0) return;   // 顔と髪は動かさない
    const p = m.geometry.attributes.position, si = m.geometry.attributes.skinIndex, sw = m.geometry.attributes.skinWeight, o = m.userData.orig;
    for (let v = 0; v < p.count; v++) {
      let x = o[v * 3], y = o[v * 3 + 1], z = o[v * 3 + 2];
      // ウエスト: 背骨の重みが強い所を、胴の中心へ寄せる
      const ws = weight(si, sw, v, [B.spine]);
      if (waist && ws > 0) { const k = 1 + waist * ws; x = spine.x + (x - spine.x) * k; z = spine.z + (z - spine.z) * k; }
      // 腰まわり: 腰の骨と太ももの付け根の重みで、横と後ろ（お尻）に広げる
      const hw = weight(si, sw, v, [B.hips]) + 0.5 * weight(si, sw, v, B.legs) * (y > hips.y - 0.12 ? 1 : 0);
      if (hip && hw > 0) { x = hips.x + (x - hips.x) * (1 + hip * hw); if ((z - hips.z) * bind.F < 0) z = hips.z + (z - hips.z) * (1 + hip * 1.3 * hw); }
      p.setXYZ(v, x, y, z);
    }
    p.needsUpdate = true;

    for (let v = 0; v < P.count; v++) { const x = orig[v * 3], y = orig[v * 3 + 1]; if (y > 1.43 && y < 1.51 && Math.abs(x) > 0.085) fold[v * 3] = Math.sign(x) * 0.082; }
    earFold = { P, orig, fold };
  }
  setKind('none');
}
// 部品を選ぶ。spec は { ears, tail, wings, horns }（形の名前）と、任意で color（{ ears: '#c8682a', tail: ... }）
function setParts(spec) {
  for (const [slot, shapes] of Object.entries(parts))
    for (const [shape, list] of Object.entries(shapes)) {
      const on = spec[slot] === shape;
      list.forEach(o => {
        o.visible = on;
        const c = on && spec.color && spec.color[slot];
        o.traverse(q => { if (q.isMesh && q.material.userData.main) {
          if (!q.material.userData.base) q.material.userData.base = q.material.color.clone();
          q.material.color.copy(c ? new THREE.Color(c) : q.material.userData.base);
          if (q.userData.tipWhite) tintTip(q);
        } });
      });
    }
  if (earFold) { earFold.P.array.set(spec.ears ? earFold.fold : earFold.orig); earFold.P.needsUpdate = true; }
  suit.uBot.value.z = bind.hips.y + (spec.tail ? 0.008 : 0.03);   // 尾があるときは、水着の後ろの上端を尾の付け根の下に下げる
}
// 狐の尾の白い先: 素材の色は白にして、点ごとの色で根元側を主な色に、先を白にする
function tintTip(m) {
  const base = m.material.color.clone(), tip = m.geometry.attributes.tip, n = tip.count, col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const w = tip.getX(i); col[i * 3] = base.r + (0.96 - base.r) * w; col[i * 3 + 1] = base.g + (0.94 - base.g) * w; col[i * 3 + 2] = base.b + (0.9 - base.b) * w; }
  m.geometry.setAttribute('color', new THREE.BufferAttribute(col, 3));
  m.material.vertexColors = true; m.material.color.set(0xffffff); m.material.needsUpdate = true;
}
function setKind(k) { kind = k; setParts(KINDS[k] || {}); }
document.querySelectorAll('#parts button').forEach(b => b.addEventListener('click', () => { press(b.parentNode, b); if (vrm) setKind(b.dataset.k); }));

// 道具（tools/gen/demi.py）から撮るための入口。部品の型（mask）は、肌を緑・亜人の部品を種類ごとの色・それ以外を黒の単色で描く。
// 描いた絵の同じ位置に部品が残っているかを、この型で数える
// 部品は種類ごとに色を分ける（尾は赤、翼は桃、頭の部品は黄）。種類ごとに残っているかを数えるため
const maskBasic = c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide });
const maskMats = { skin: maskBasic(0x00ff00), other: maskBasic(0x000000), tail: maskBasic(0xff0000), wing: maskBasic(0xff00ff), head: maskBasic(0xffff00), part: maskBasic(0xff0000) };
function maskMode(on) {
  vrm.scene.traverse(o => {
    if (!o.isMesh) return;
    if (on) {
      if (!o.userData.mat) o.userData.mat = o.material;
      let part = null; for (let q = o; q && !part; q = q.parent) part = q.userData.part || null;
      o.material = part ? maskMats[part] : /_SKIN/.test(o.userData.mat.name || '') ? maskMats.skin : maskMats.other;
    } else if (o.userData.mat) { o.material = o.userData.mat; delete o.userData.mat; }
  });
}
window.tool = { hairColor: hex => meshes.forEach(m => { if (/HAIR/.test(matName(m)) && !m.userData.earPart) { m.material.map = null; m.material.color.set(hex); m.material.needsUpdate = true; } }), parts: spec => setParts(spec), hair: on => meshes.forEach(m => { if (/HAIR/.test(matName(m)) && !m.userData.earPart) m.visible = on; }), barefoot: on => meshes.forEach(m => { if (/Shoes/.test(matName(m))) m.visible = !on; }), kind: k => setKind(k), body: n => setBody(n === 'ideal' ? IDEAL : ZERO), pose: id => pose(id), view: a => view(a, false), mask: maskMode };

fetch('base-vrm.txt').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(t => {
  const bin = atob(t.trim()); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const loader = new THREE.GLTFLoader();
  loader.register(parser => new THREE_VRM.VRMLoaderPlugin(parser));
  loader.parse(bytes.buffer, '', gltf => {
    vrm = gltf.userData.vrm;
    THREE_VRM.VRMUtils.rotateVRM0(vrm);
    // VRoid の古い形式（VRM 0.x）の MToon は、この組み合わせ（three 0.147 と three-vrm 1.0.6）では肌と髪が真っ黒に出た。
    // 古い形式のときだけ、元の絵（map）と色を引き継いだ陰2段の素材（MeshToonMaterial）に置き換える。輪郭線の素材は外す
    if (vrm.meta.metaVersion === '0') {
      vrm.scene.traverse(o => {
        if (!o.isMesh) return;
        const src = Array.isArray(o.material) ? o.material[0] : o.material;
        const u = src.uniforms || {};
        const map = src.map || (u.map && u.map.value) || null;
        const lit = (u.litFactor && u.litFactor.value) || src.color || new THREE.Color(0xffffff);
        o.material = new THREE.MeshToonMaterial({ map, color: lit.clone(), gradientMap: ramp,
          transparent: !!src.transparent, alphaTest: src.alphaTest || (src.transparent ? 0 : 0.5),
          side: src.side, depthWrite: src.depthWrite });
        o.material.name = src.name;
      });
    }
    vrm.scene.traverse(o => { o.frustumCulled = false; });
    scene.add(vrm.scene);
    const box = new THREE.Box3().setFromObject(vrm.scene);
    height = box.max.y - box.min.y; center.set(0, box.min.y + height / 2, 0);
    setupBody(); hideCatEars(); paintSuit(); setupParts(); wear('swim'); shape(readBody());
    pose('stand'); resize(); light(); view(0, false);
    load.hidden = true; window.ready = true;
  }, () => { load.textContent = '模型を読み込めませんでした。ページを開き直してください。'; });
}).catch(() => { load.textContent = '模型を読み込めませんでした。ページを開き直してください。'; });

const clock = new THREE.Clock();
(function loop() {
  const dt = clock.getDelta();
  if (vrm) vrm.update(dt);
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
})();
</script>
